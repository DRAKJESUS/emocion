<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Analizador de Emociones</title>
  <script>
    async function analizarEmocion() {
      const fileInput = document.getElementById("fileInput");
      const emotionOutput = document.getElementById("emotionOutput");
      const emotionText = document.getElementById("emotionText");
      const pointsImage = document.getElementById("pointsImage");

      // Limpiar resultados previos
      emotionOutput.classList.add("d-none");
      emotionText.textContent = "";
      pointsImage.src = "";

      if (!fileInput.files.length) {
        alert("Por favor, selecciona una imagen.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        // Llamar a la API
        const response = await fetch("https://web-production-c4eef.up.railway.app/upload", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          throw new Error("Error en la solicitud. Por favor, verifica la imagen o inténtalo más tarde.");
        }

        const result = await response.json();

        if (result.error) {
          throw new Error(result.error);
        }

        // Mostrar resultados
        emotionText.textContent = result.dominant_emotion || "Emoción no detectada.";
        pointsImage.src = data:image/png;base64,${result.image_with_points_base64};
        emotionOutput.classList.remove("d-none");
      } catch (error) {
        alert(Error: ${error.message});
      }
    }
  </script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-lg" style="width: 22rem;">
    <div class="card-body">
      <h1 class="card-title text-center text-primary fw-bold">Detecta tu Emoción</h1>
      <form id="emotionForm" class="mt-4">
        <div class="mb-3">
          <label for="fileInput" class="form-label fw-bold">Sube una foto:</label>
          <input 
            type="file" 
            id="fileInput" 
            class="form-control" 
            accept="image/*">
        </div>
        <div class="d-grid">
          <button 
            type="button" 
            class="btn btn-primary btn-lg"
            onclick="analizarEmocion()">
            Examinar Emoción
          </button>
        </div>
      </form>
      <div id="emotionOutput" class="text-center mt-4 d-none">
        <h2 class="fw-bold text-secondary">Resultados:</h2>
        <p id="emotionText" class="fs-4 text-success fw-bold"></p>
        <div>
          <img id="pointsImage" class="img-fluid mt-3 border rounded" alt="Imagen con puntos faciales">
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
